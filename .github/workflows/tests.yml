name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate curriculum, prerequisite audit and example profile
        run: python tools/learning_data.py validate
      - name: Print the prerequisite audit
        run: python tools/learning_data.py audit --json
      - name: Run the test suite
        run: python -m unittest discover -s tests -v
